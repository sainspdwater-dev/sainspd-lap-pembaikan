<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAINS PD • SECURE LOGIN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050817; --neon-cyan: #00e5ff; --neon-purple: #a855f7;
            --neon-red: #ef4444; --glass-bg: rgba(8, 15, 40, 0.65);
            --text-primary: #f0f5ff; --text-dim: #a0b3d9;
            --font-head: 'Orbitron', 'Segoe UI', sans-serif; --font-body: 'Rajdhani', 'Segoe UI', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg-dark); font-family: var(--font-body); min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; position: relative; overflow-x: hidden; overflow-y: auto; padding: 20px 12px; color: var(--text-primary); }
        .bg-layer { position: fixed; inset: 0; z-index: -3; pointer-events: none; background: radial-gradient(circle at 20% 30%, rgba(0, 229, 255, 0.08) 0%, transparent 30%), radial-gradient(circle at 80% 70%, rgba(168, 85, 247, 0.1) 0%, transparent 35%), #050817; }
        .grid-overlay { position: fixed; inset: 0; z-index: -2; pointer-events: none; background-image: linear-gradient(rgba(0, 229, 255, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 229, 255, 0.04) 1px, transparent 1px); background-size: 40px 40px; }
        .login-card { background: #081028; border-radius: 24px; border: 1px solid rgba(0, 229, 255, 0.3); box-shadow: 0 12px 32px rgba(0,0,0,0.5); padding: 2rem; width: min(440px, 100%); position: relative; margin: auto; }
        .badge-wrap { display: flex; justify-content: center; margin-bottom: 1rem; }
        .badge { border: 1px solid rgba(0, 229, 255, 0.7); padding: 0.35rem 1.2rem; border-radius: 30px; font-family: var(--font-head); font-size: 0.65rem; letter-spacing: 2px; color: var(--neon-cyan); background: rgba(0, 229, 255, 0.05); text-transform: uppercase; }
        .title-main { font-family: var(--font-head); font-weight: 900; font-size: 1.8rem; text-align: center; letter-spacing: 3px; background: linear-gradient(135deg, #e0f2fe, var(--neon-cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 0.25rem; }
        .login-subtitle { text-align: center; color: var(--text-dim); font-size: .8rem; letter-spacing: .15em; text-transform: uppercase; margin-bottom: 1.5rem; }
        .input-group { margin-bottom: 1rem; }
        .input-group.password-group { margin-bottom: 1.5rem; }
        .input-label { display: block; color: var(--neon-cyan); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; margin-bottom: .5rem; }
        .password-wrap { position: relative; display: flex; align-items: center; }
        input { width: 100%; background: rgba(0, 10, 25, 0.7); border: 1px solid rgba(0, 229, 255, 0.4); border-radius: 12px; padding: 0.8rem 1rem; color: white; font-family: var(--font-body); font-size: 1rem; outline: none; }
        #password { padding-right: 3rem; }
        input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }
        .toggle-password { position: absolute; right: 0; width: 48px; background: none; border: none; color: var(--neon-cyan); cursor: pointer; display: flex; align-items: center; justify-content: center; height: 100%; }
        .eye-icon { width: 22px; height: 22px; fill: none; stroke: var(--neon-cyan); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
        .login-btn { width: 100%; min-height: 52px; padding: 0.8rem; border-radius: 14px; border: 1px solid var(--neon-cyan); background: rgba(0, 229, 255, 0.05); color: var(--neon-cyan); font-family: var(--font-head); font-weight: 700; letter-spacing: 2px; cursor: pointer; text-transform: uppercase; }
        .login-btn:hover { background: rgba(0, 229, 255, 0.2); color: white; box-shadow: 0 0 25px rgba(0, 229, 255, 0.5); }
        .login-btn:disabled { opacity: .55; cursor: wait; box-shadow: none; }
        button:focus-visible, input:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
        .login-error { color: #fca5a5; min-height: 1.2rem; margin: .5rem 0; font-size: .9rem; }
        .remember-row { display: flex; align-items: center; gap: .55rem; color: var(--text-primary); font-size: .95rem; cursor: pointer; margin: -.5rem 0 1rem; }
        .remember-row input { width: auto; accent-color: var(--neon-cyan); }
        .auth-overlay { position: absolute; inset: 0; background: rgba(5, 8, 23, 0.96); border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; z-index: 10; }
        .auth-overlay.active { opacity: 1; pointer-events: auto; }
        .success-check { width: 65px; height: 65px; border: 2px solid var(--neon-cyan); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--neon-cyan); margin-bottom: 1rem; box-shadow: 0 0 20px var(--neon-cyan); }
        .auth-title { color: var(--neon-cyan); font-size: 1.1rem; letter-spacing: .15em; }
        .auth-sub { color: var(--text-dim); font-size: .8rem; margin-top: .5rem; }
        @media (max-height: 780px) { .login-card { padding: 1.25rem; } .login-subtitle { margin-bottom: 1rem; } }
    </style>
</head>
<body>
    <div class="bg-layer"></div><div class="grid-overlay"></div>
    <div class="login-card">
        <div class="badge-wrap"><span class="badge">SAINS PD</span></div>
        <h1 class="title-main">LAPORAN PEMBAIKAN</h1>
        <p class="login-subtitle">Secure System Login</p>

        <form id="onlineLoginForm" autocomplete="on">
        <div class="input-group">
            <label class="input-label" for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Masukkan username" autocomplete="username" required>
        </div>
        <div class="input-group password-group">
            <label class="input-label" for="password">Password</label>
            <div class="password-wrap">
                <input type="password" id="password" name="password" placeholder="Masukkan password" autocomplete="current-password" required>
                <button class="toggle-password" id="togglePass" type="button" aria-label="Toggle password">
                    <svg class="eye-icon" id="eyeIconShow" viewBox="0 0 24 24">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <svg class="eye-icon" id="eyeIconHide" viewBox="0 0 24 24" style="display: none;">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                        <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </button>
            </div>
        </div>
        <label class="remember-row" for="rememberMe"><input id="rememberMe" type="checkbox"> Remember me (username &amp; password)</label>
        <button class="login-btn" id="loginBtn" type="submit">Sign In</button>
        <p id="onlineLoginError" class="login-error" role="alert" aria-live="assertive"></p>
        </form>
        <div id="desktopOfflineLogin" style="display:none; margin-top:1.2rem; border-top:1px solid rgba(0,229,255,.25); padding-top:1rem;">
            <p id="desktopOfflineAccount" style="color:#a0b3d9; margin-bottom:.6rem;"></p>
            <label class="input-label" for="offlineCode">Kod akses offline</label>
            <input type="password" id="offlineCode" placeholder="Kod offline komputer ini" autocomplete="off" style="margin-bottom:.6rem;">
            <p id="offlineLoginError" role="alert" aria-live="assertive" style="color:#fca5a5;min-height:1.2rem;margin-bottom:.4rem;"></p>
            <button class="login-btn" id="offlineLoginBtn" type="button">Buka Offline</button>
            <p style="color:#a0b3d9; margin-top:.5rem; font-size:.85rem;">Rekod terakhir yang diselaraskan sahaja. Fungsi pelayan dan AI memerlukan internet.</p>
            <label style="display:block;color:#a0b3d9;margin-top:.8rem;font-size:.85rem;"><input id="desktopResetCodeCheck" type="checkbox" style="width:auto;margin-right:.4rem;">Tukar kod offline selepas log masuk online</label>
        </div>
        <div id="desktopOfflineSetup" style="display:none; margin-top:1.2rem; border-top:1px solid rgba(0,229,255,.25); padding-top:1rem;">
            <p style="color:#a0b3d9; margin-bottom:.6rem;">Aktifkan akses offline pada komputer ini. Kod mesti sekurang-kurangnya 8 aksara.</p>
            <input type="password" id="desktopCodeFirst" placeholder="Kod offline baharu" autocomplete="new-password" style="margin-bottom:.5rem;">
            <input type="password" id="desktopCodeSecond" placeholder="Ulang kod offline" autocomplete="new-password" style="margin-bottom:.5rem;">
            <p id="desktopCodeError" role="alert" style="color:#fca5a5; margin-bottom:.5rem;"></p>
            <button class="login-btn" id="desktopCodeSave" type="button">Aktifkan Offline</button>
            <button id="desktopCodeSkip" type="button" style="color:#a0b3d9;display:block;margin:1rem auto 0;cursor:pointer;">Langkau buat masa ini</button>
        </div>

        <div class="auth-overlay" id="authOverlay">
            <div class="success-check" id="checkMark" style="display:none;">✓</div>
            <div class="auth-title" id="authTitle">AUTHENTICATING...</div>
            <div class="auth-sub" id="authSub"></div>
        </div>
    </div>

    <script>
        const WORKER_URL = 'https://laporanpembaikan.sainspdwater.workers.dev/';

        // Toggle Password Visibility
        let pwVisible = false;
        document.getElementById('togglePass').addEventListener('click', () => {
            pwVisible = !pwVisible;
            document.getElementById('password').type = pwVisible ? 'text' : 'password';
            document.getElementById('eyeIconShow').style.display = pwVisible ? 'none' : 'block';
            document.getElementById('eyeIconHide').style.display = pwVisible ? 'block' : 'none';
        });

        async function hashSHA256(str) {
            const buf = await crypto.subtle.digest("SHA-256", new TextEncoder("utf-8").encode(str));
            return Array.prototype.map.call(new Uint8Array(buf), x=>(('00'+x.toString(16)).slice(-2))).join('');
        }

        if (window.sainsDesktop) {
            window.sainsDesktop.offlineStatus().then(status => {
                if (!status.available) return;
                document.getElementById('desktopOfflineLogin').style.display = 'block';
                document.getElementById('desktopOfflineAccount').textContent = `Akaun offline: ${status.username}`;
                document.getElementById('username').value = status.username;
            }).catch(console.error);
            const offlineCodeInput = document.getElementById('offlineCode');
            const offlineLoginError = document.getElementById('offlineLoginError');
            const offlineLoginButton = document.getElementById('offlineLoginBtn');
            offlineCodeInput.addEventListener('input', () => { offlineLoginError.textContent = ''; });
            offlineCodeInput.addEventListener('keydown', event => {
                if (event.key === 'Enter') { event.preventDefault(); offlineLoginButton.click(); }
            });
            offlineLoginButton.addEventListener('click', async () => {
                if (offlineLoginButton.disabled) return;
                if (!offlineCodeInput.value) {
                    offlineLoginError.textContent = 'Masukkan kod offline komputer ini.';
                    offlineCodeInput.focus();
                    return;
                }
                offlineLoginButton.disabled = true;
                offlineLoginError.textContent = '';
                try {
                    const account = await window.sainsDesktop.unlockOffline(offlineCodeInput.value);
                    await window.sainsDesktopStore?.restore();
                    if (!localStorage.getItem('sainsRawData')) throw new Error('Tiada rekod setempat. Sambung internet dan log masuk online sekali untuk memuat turun data.');
                    localStorage.setItem('sainsLoggedIn', 'true');
                    localStorage.setItem('sainsUserLevel', account.level);
                    localStorage.setItem('sainsDesktopOffline', 'true');
                    localStorage.removeItem('sainsToken');
                    localStorage.setItem('sainsSessionStart', Date.now());
                    localStorage.setItem('sainsLastActivity', Date.now());
                    window.location.href = 'dashboard.html';
                } catch (error) {
                    const detail = error?.message || '';
                    offlineLoginError.textContent = detail.includes('Kod offline tidak tepat') ? 'Kod offline tidak tepat. Cuba semula.'
                        : detail.includes('Terlalu banyak cubaan') ? 'Terlalu banyak cubaan. Tunggu 5 minit sebelum cuba lagi.'
                        : detail.replace(/^Error invoking remote method.*?: Error:\s*/i, '') || 'Akses offline gagal.';
                    offlineCodeInput.focus();
                    offlineCodeInput.select();
                } finally { offlineLoginButton.disabled = false; }
            });
        }

        function requestOfflineSetup() {
            return new Promise(resolve => {
                const panel = document.getElementById('desktopOfflineSetup');
                const errorText = document.getElementById('desktopCodeError');
                panel.style.display = 'block';
                document.getElementById('authOverlay').classList.remove('active');
                document.getElementById('desktopCodeSkip').onclick = () => { panel.style.display = 'none'; resolve(false); };
                document.getElementById('desktopCodeSave').onclick = async () => {
                    const first = document.getElementById('desktopCodeFirst').value;
                    const second = document.getElementById('desktopCodeSecond').value;
                    if (first.length < 8) { errorText.textContent = 'Kod mesti sekurang-kurangnya 8 aksara.'; return; }
                    if (first !== second) { errorText.textContent = 'Kod tidak sepadan.'; return; }
                    try {
                        await window.sainsDesktop.registerOffline(first);
                        panel.style.display = 'none';
                        resolve(true);
                    } catch (error) { errorText.textContent = error.message || 'Gagal mengaktifkan akses offline.'; }
                };
            });
        }

        const onlineLoginButton = document.getElementById('loginBtn');
        const onlineLoginError = document.getElementById('onlineLoginError');
        const rememberMe = document.getElementById('rememberMe');
        rememberMe.checked = localStorage.getItem('sainsRememberLogin') === 'true';
        for (const field of [document.getElementById('username'), document.getElementById('password')]) {
            field.addEventListener('input', () => { onlineLoginError.textContent = ''; });
        }
        document.getElementById('onlineLoginForm').addEventListener('submit', async event => {
            event.preventDefault();
            if (onlineLoginButton.disabled) return;
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            if (!user || !pass) {
                onlineLoginError.textContent = 'Sila isi username dan password.';
                document.getElementById(user ? 'password' : 'username').focus();
                return;
            }

            const overlay = document.getElementById('authOverlay');
            onlineLoginButton.disabled = true;
            onlineLoginError.textContent = '';
            overlay.classList.add('active');
            document.getElementById('authTitle').innerText = "AUTHENTICATING...";
            document.getElementById('authTitle').style.color = "#00e5ff";
            document.getElementById('authSub').innerText = '';
            let completed = false;

            try {
                const hashedPass = await hashSHA256(pass);
                const data = window.sainsDesktop
                    ? await window.sainsDesktop.onlineLogin(user, hashedPass)
                    : await (await fetch(WORKER_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'login', username: user, passwordHash: hashedPass })
                    })).json();

                if(data.status === 'success') {
                    localStorage.setItem('sainsRememberLogin', String(rememberMe.checked));
                    localStorage.setItem('sainsToken', data.token);
                    localStorage.setItem('sainsUserLevel', data.level);
                    localStorage.setItem('sainsLoggedIn', 'true');
                    localStorage.setItem('sainsSessionStart', String(Date.now()));
                    localStorage.removeItem('sainsLastActivity');
                    if (rememberMe.checked && !window.sainsDesktop && window.PasswordCredential && navigator.credentials?.store) {
                        try {
                            document.getElementById('authSub').innerText = 'Semak pilihan simpan kata laluan pada pelayar...';
                            await navigator.credentials.store(new PasswordCredential({id: user, password: pass, name: user}));
                        } catch (_) {
                            // Browser password storage is optional; authentication itself has succeeded.
                        }
                    }
                    document.getElementById('checkMark').style.display = 'flex';
                    document.getElementById('authTitle').innerText = "CONNECTED";
                    document.getElementById('authSub').innerText = "Memuatkan Papan Pemuka...";
                    
                    if (window.sainsDesktop) {
                        localStorage.removeItem('sainsDesktopOffline');
                        const status = await window.sainsDesktop.offlineStatus();
                        if (!status.available || document.getElementById('desktopResetCodeCheck')?.checked) await requestOfflineSetup();
                    }

                    completed = true;
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    throw new Error(data.message || 'Log masuk gagal');
                }
            } catch (err) {
                document.getElementById('checkMark').style.display = 'none';
                overlay.classList.remove('active');
                const detail = err?.message || '';
                onlineLoginError.textContent = (!navigator.onLine || /fetch failed|network|timeout|abort/i.test(detail))
                    ? 'Tiada sambungan pelayan. Jika akaun offline sudah disediakan, gunakan Buka Offline.'
                    : detail.replace(/^Error invoking remote method.*?: Error:\s*/i, '') || 'Log masuk gagal.';
                document.getElementById('password').focus();
            } finally {
                if (!completed) onlineLoginButton.disabled = false;
            }
        });
    </script>
</body>
</html>
