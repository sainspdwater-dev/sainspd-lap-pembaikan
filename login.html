<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAINS PD • SECURE LOGIN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-dark: #050817; --neon-cyan: #00e5ff; --neon-purple: #a855f7;
            --neon-red: #ef4444; --glass-bg: rgba(8, 15, 40, 0.65);
            --text-primary: #f0f5ff; --text-dim: #a0b3d9;
            --font-head: 'Orbitron', sans-serif; --font-body: 'Rajdhani', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg-dark); font-family: var(--font-body); min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; color: var(--text-primary); }
        .bg-layer { position: fixed; inset: 0; z-index: -3; background: radial-gradient(circle at 20% 30%, rgba(0, 229, 255, 0.08) 0%, transparent 30%), radial-gradient(circle at 80% 70%, rgba(168, 85, 247, 0.1) 0%, transparent 35%), #050817; }
        .grid-overlay { position: fixed; inset: 0; z-index: -2; background-image: linear-gradient(rgba(0, 229, 255, 0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 229, 255, 0.04) 1px, transparent 1px); background-size: 40px 40px; }
        .particles { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
        .particle { position: absolute; width: 3px; height: 3px; background: var(--neon-cyan); border-radius: 50%; opacity: 0.2; animation: floatParticle 12s infinite linear; }
        @keyframes floatParticle { 0% { transform: translateY(0); opacity: 0.1; } 50% { opacity: 0.4; } 100% { transform: translateY(-100vh); opacity: 0; } }
        .login-card { background: var(--glass-bg); backdrop-filter: blur(16px); border-radius: 24px; border: 1px solid rgba(0, 229, 255, 0.3); box-shadow: 0 0 30px rgba(0, 229, 255, 0.15), 0 20px 50px rgba(0,0,0,0.6); padding: 2.5rem 2rem; width: 400px; max-width: 90vw; position: relative; }
        .badge { border: 1px solid rgba(0, 229, 255, 0.7); padding: 0.35rem 1.2rem; border-radius: 30px; font-family: var(--font-head); font-size: 0.65rem; letter-spacing: 2px; color: var(--neon-cyan); background: rgba(0, 229, 255, 0.05); text-transform: uppercase; }
        .title-main { font-family: var(--font-head); font-weight: 900; font-size: 1.8rem; text-align: center; letter-spacing: 3px; background: linear-gradient(135deg, #e0f2fe, var(--neon-cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 0.25rem; }
        input { width: 100%; background: rgba(0, 10, 25, 0.7); border: 1px solid rgba(0, 229, 255, 0.4); border-radius: 12px; padding: 0.9rem 3rem 0.9rem 1.2rem; color: white; font-family: var(--font-body); font-size: 1rem; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }
        .toggle-password { position: absolute; right: 12px; background: none; border: none; color: var(--neon-cyan); cursor: pointer; display: flex; align-items: center; justify-content: center; height: 100%; }
        .eye-icon { width: 22px; height: 22px; fill: none; stroke: var(--neon-cyan); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
        .login-btn { width: 100%; padding: 0.9rem; border-radius: 14px; border: 1px solid var(--neon-cyan); background: rgba(0, 229, 255, 0.05); color: var(--neon-cyan); font-family: var(--font-head); font-weight: 700; letter-spacing: 3px; cursor: pointer; transition: 0.35s; text-transform: uppercase; }
        .login-btn:hover { background: rgba(0, 229, 255, 0.2); color: white; box-shadow: 0 0 25px rgba(0, 229, 255, 0.5); }
        .auth-overlay { position: absolute; inset: 0; background: rgba(5, 8, 23, 0.9); backdrop-filter: blur(8px); border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.4s; z-index: 10; }
        .auth-overlay.active { opacity: 1; pointer-events: auto; }
        .success-check { width: 65px; height: 65px; border: 2px solid var(--neon-cyan); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--neon-cyan); margin-bottom: 1rem; box-shadow: 0 0 20px var(--neon-cyan); }
    </style>
</head>
<body>
    <div class="bg-layer"></div><div class="grid-overlay"></div>
    <div class="particles" id="particles"></div>

    <div class="login-card">
        <div class="flex justify-center mb-4"><span class="badge">SAINS PD</span></div>
        <h1 class="title-main">LAPORAN PEMBAIKAN</h1>
        <p class="text-center text-xs tracking-widest text-slate-400 mb-6 uppercase">Secure System Login</p>

        <div class="mb-4">
            <label class="block font-mono text-xs text-cyan-400 mb-2 uppercase tracking-wider">Username</label>
            <input type="text" id="username" placeholder="Masukkan username" autocomplete="off">
        </div>
        <div class="mb-6">
            <label class="block font-mono text-xs text-cyan-400 mb-2 uppercase tracking-wider">Password</label>
            <div class="relative flex items-center">
                <input type="password" id="password" placeholder="Masukkan password">
                <button class="toggle-password" id="togglePass" type="button" aria-label="Toggle password">
                    <svg class="eye-icon" id="eyeIconShow" viewBox="0 0 24 24">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <svg class="eye-icon" id="eyeIconHide" viewBox="0 0 24 24" style="display: none;">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                        <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </button>
            </div>
        </div>
        <button class="login-btn" id="loginBtn">Sign In</button>

        <div class="auth-overlay" id="authOverlay">
            <div class="success-check" id="checkMark" style="display:none;">✓</div>
            <div class="font-mono text-xl tracking-widest text-cyan-400" id="authTitle">AUTHENTICATING...</div>
            <div class="text-xs text-slate-400 mt-2 tracking-wider" id="authSub"></div>
        </div>
    </div>

    <script>
        const WORKER_URL = 'https://laporanpembaikan.sainspdwater.workers.dev/';

        for(let i=0; i<20; i++) {
            let p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random()*100+'%';
            p.style.top = Math.random()*100+'%';
            p.style.animationDuration = (8+Math.random()*10)+'s';
            document.querySelector('.particles').appendChild(p);
        }

        // Toggle Password Visibility
        let pwVisible = false;
        document.getElementById('togglePass').addEventListener('click', () => {
            pwVisible = !pwVisible;
            document.getElementById('password').type = pwVisible ? 'text' : 'password';
            document.getElementById('eyeIconShow').style.display = pwVisible ? 'none' : 'block';
            document.getElementById('eyeIconHide').style.display = pwVisible ? 'block' : 'none';
        });

        async function hashSHA256(str) {
            const buf = await crypto.subtle.digest("SHA-256", new TextEncoder("utf-8").encode(str));
            return Array.prototype.map.call(new Uint8Array(buf), x=>(('00'+x.toString(16)).slice(-2))).join('');
        }

        document.getElementById('loginBtn').addEventListener('click', async () => {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if(!user || !pass) { alert('Sila isi username dan password'); return; }

            const overlay = document.getElementById('authOverlay');
            overlay.classList.add('active');
            document.getElementById('authTitle').innerText = "AUTHENTICATING...";
            document.getElementById('authTitle').style.color = "#00e5ff";

            try {
                const hashedPass = await hashSHA256(pass);
                const res = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action: 'login', username: user, passwordHash: hashedPass })
                });
                const data = await res.json();

                if(data.status === 'success') {
                    document.getElementById('checkMark').style.display = 'flex';
                    document.getElementById('authTitle').innerText = "CONNECTED";
                    document.getElementById('authSub').innerText = "Memuatkan Papan Pemuka...";
                    
                    localStorage.setItem('sainsUserLevel', data.level);
                    localStorage.setItem('sainsLoggedIn', 'true');

                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    throw new Error(data.message || 'Log masuk gagal');
                }
            } catch (err) {
                document.getElementById('checkMark').style.display = 'none';
                document.getElementById('authTitle').innerText = "ACCESS DENIED";
                document.getElementById('authTitle').style.color = "#ef4444";
                document.getElementById('authSub').innerText = err.message || "Ralat rangkaian pelayan";
                setTimeout(() => {
                    overlay.classList.remove('active');
                }, 2200);
            }
        });
    </script>
</body>
</html>
